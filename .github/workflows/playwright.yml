name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Dùng Container là cực kỳ chuyên nghiệp rồi, giữ nguyên cái này
    container:
      image: mcr.microsoft.com/playwright:v1.43.0-jammy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          # Thêm dòng này để GitHub lưu lại các thư viện npm đã tải
          cache: "npm"

      - name: Install dependencies
        # Dùng 'npm ci' thay vì 'install' trên CI để tốc độ ổn định hơn
        run: npm ci

      # BƯỚC NÀY ĐÃ BỊ XÓA VÌ TRONG DOCKER IMAGE ĐÃ CÓ SẴN BROWSERS

      - name: Run Playwright tests
        # Sơn nhớ kiểm tra xem file tests/post.test.ts có thực sự tồn tại không nhé
        run: npx playwright test tests/post.test.ts --project api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
