name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Đây chính là lúc bạn chọn máy ảo (Ubuntu)
    container:
      image: mcr.microsoft.com/playwright:v1.43.0-jammy
    steps:
      - uses: actions/checkout@v4 # Lấy code từ repo vào VM
      - uses: actions/setup-node@v4 # Cài đặt môi trường Node.js
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install # Cài đặt các thư viện cần thiết
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps # Cài trình duyệt cho VM
      - name: Run Playwright tests
        run: npx playwright test tests/post.test.ts --project api # Lệnh chạy code auto của bạn
      - uses: actions/upload-artifact@v4 # Lưu lại kết quả (report) nếu cần
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
