name: Playwright Tests
on:
  push:
    branches: [main] # Chạy khi có code mới đẩy lên nhánh main
  pull_request:
    branches: [main] # Chạy khi có Pull Request vào nhánh main
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test tests/ --project api --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob

      - name: Upload partial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Đặt tên riêng cho từng shard để không bị ghi đè
          name: all-shard-reports-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download all shards reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: all-shard-reports-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: |
          npx playwright merge-reports --reporter html ./all-reports

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-playwright-report
          path: playwright-report/
          retention-days: 30
